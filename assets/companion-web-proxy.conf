# Operator-owned native reverse-proxy integration for CloudPanel Companion.
client_max_body_size 64k;
location / {
    proxy_pass http://unix:/run/cloudpanel-companion-web/app.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    proxy_connect_timeout 30;
    proxy_send_timeout 45;
    proxy_read_timeout 45;
    proxy_max_temp_file_size 0;
}
location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    try_files $uri =404;
}
location /static/ {
    alias /var/lib/cloudpanel-companion-web/static/;
    add_header X-Content-Type-Options nosniff always;
}
