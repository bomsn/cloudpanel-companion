# Operator-owned native reverse-proxy integration for CloudPanel Companion.
# $companion_client_ip and $companion_client_country come from
# sites-enabled/000-companion-security.conf (companion/client_address.py): the
# Cloudflare-validated client, never an address a client chose. They replace every
# forwarded-address header, and Cloudflare's own headers never reach the interface.
client_max_body_size 64k;
access_log /var/log/cloudpanel-companion/companion-access.log companion_access if=$companion_access_observe;
location / {
    proxy_pass http://unix:/run/cloudpanel-companion-web/app.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $companion_client_ip;
    proxy_set_header X-Real-IP $companion_client_ip;
    proxy_set_header X-Companion-Country $companion_client_country;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header CF-IPCountry "";
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    proxy_connect_timeout 30;
    proxy_send_timeout 45;
    proxy_read_timeout 45;
    proxy_max_temp_file_size 0;
}
location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    try_files $uri =404;
}
location /static/ {
    alias /var/lib/cloudpanel-companion-web/static/;
    add_header X-Content-Type-Options nosniff always;
}
