# Dedicated authentication state. No TCP listener or website access.
port 0
unixsocket /run/cloudpanel-companion-security/redis.sock
unixsocketperm 660
daemonize no
logfile ""
dir /var/lib/cloudpanel-companion-security
appendonly yes
appendfsync always
save ""
maxmemory 32mb
maxmemory-policy noeviction
