{% load allauth %}<div class="field{% if attrs.errors %} has-error{% endif %}">
{% if attrs.type == "checkbox" or attrs.type == "radio" %}<label class="check" for="{{ attrs.id }}"><input type="{{ attrs.type }}"{% if attrs.id %} id="{{ attrs.id }}"{% endif %}{% if attrs.name %} name="{{ attrs.name }}"{% endif %}{% if attrs.value is not None %} value="{{ attrs.value }}"{% endif %}{% if attrs.checked %} checked{% endif %}{% if attrs.required %} required{% endif %}{% if attrs.disabled %} disabled{% endif %}><span>{% slot label %}{% endslot %}</span></label>
{% else %}<label for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
<input type="{{ attrs.type }}"{% if attrs.id %} id="{{ attrs.id }}"{% endif %}{% if attrs.name %} name="{{ attrs.name }}"{% endif %}{% if attrs.value is not None %} value="{{ attrs.value }}"{% endif %}{% if attrs.placeholder %} placeholder="{{ attrs.placeholder }}"{% endif %}{% if attrs.autocomplete %} autocomplete="{{ attrs.autocomplete }}"{% endif %}{% if attrs.required %} required{% endif %}{% if attrs.disabled %} disabled{% endif %}{% if attrs.readonly %} readonly{% endif %}>{% endif %}
{% if slots.help_text %}<p class="field-help">{% slot help_text %}{% endslot %}</p>{% endif %}{{ attrs.errors }}
</div>
