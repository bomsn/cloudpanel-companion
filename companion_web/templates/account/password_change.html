{% extends "account/base_manage_password.html" %}
{% load allauth %}
{% block head_title %}Change password{% endblock %}
{% block account_body %}
<section class="card" aria-labelledby="password-title">
  <div class="card-header"><h2 id="password-title">Change password</h2></div>
  <div class="card-body">
    <form method="post" action="{% url 'account_change_password' %}">
      {% csrf_token %}
      {{ redirect_field }}
      {% element fields form=form %}{% endelement %}
      <div class="form-actions"><button class="btn btn-primary" type="submit">Change password</button></div>
    </form>
  </div>
</section>
{% endblock %}
