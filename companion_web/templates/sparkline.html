{# A trend line from monitoring.sparkline. The caller prints its text equivalent. #}<svg class="sparkline" viewBox="0 0 120 32" preserveAspectRatio="none" aria-hidden="true" focusable="false">{% for area in trend.areas %}<polygon points="{{ area }}" class="sparkline-area"/>{% endfor %}{% for segment in trend.segments %}<polyline points="{{ segment }}" class="sparkline-line"/>{% endfor %}</svg>
