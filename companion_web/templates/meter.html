{# A bar for a share from 0 to 100. The value is always printed next to it, so the bar is hidden from screen readers. #}<svg class="meter{% if tone %} meter-{{ tone }}{% endif %}" viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true" focusable="false"><rect class="meter-track" width="100" height="6"/><rect class="meter-fill" width="{{ width }}" height="6"/></svg>
